server:
  port: 8084

spring:
  application:
    name: hotel-inventory
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        default-requeue-rejected: false
  mongodb:
    uri: mongodb://localhost:27017/hotel_db
  jwt:
    secret: ${JWT_SECRET}

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

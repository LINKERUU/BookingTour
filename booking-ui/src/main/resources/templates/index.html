<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Главная</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 min-h-screen">
<nav class="bg-blue-700 text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
        <a href="/index" class="font-bold text-2xl">TourBooking</a>
        <div class="flex items-center gap-6">
            <span class="text-blue-200" th:text="${session.username}"></span>
            <a href="/my-orders" class="hover:text-blue-200 text-sm">Мои заказы</a>
            <a href="/logout"
               class="bg-white text-blue-700 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-50 transition">
                Выйти
            </a>
        </div>
    </div>
</nav>
<main class="max-w-7xl mx-auto px-6 py-10">
    <div class="bg-gradient-to-r from-blue-800 to-blue-500 rounded-3xl text-white p-12 mb-10 text-center">
        <h1 class="text-4xl font-bold mb-3">Забронируйте тур мечты</h1>
        <p class="text-blue-100 text-lg mb-6">Рейсы и отели в одном месте</p>
        <a href="/booking"
           class="bg-white text-blue-700 px-8 py-3 rounded-xl font-bold text-lg hover:bg-blue-50 hover:scale-105 transition-transform">
            Забронировать
        </a>
    </div>

    <section class="mb-10 ml-2">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Доступные рейсы</h2>
        <div th:if="${#lists.isEmpty(flights)}" class="text-gray-400 text-center py-8">Рейсы не найдены</div>
        <div class="flex gap-6">
            <div th:each="flight: ${flights}" class="bg-white rounded-2xl shadow p-6 hover:shadow-md transition">
                <div class="flex justify-between items-start mb-2">
                    <span class="text-lg font-bold text-blue-800" th:text="${flight.flightNumber}"></span>
                    <span class="text-xs bg-green-100 font-semibold text-green-700 px-2 py-1 rounded-full"
                          th:text="${flight.availableSeats}+' мест'">148 </span>
                </div>
                <div class="flex items-center gap-2 text-gray-700 mb-2">
                    <span class="font-semibold" th:text="${flight.departureFrom}"></span>
                    <span class="text-gray-700 text-2xl">→</span>
                    <span class="font-semibold" th:text="${flight.arrivalTo}"></span>
                </div>
                <div class="text-sm text-gray-400 mb-4"
                     th:text="${#temporals.format(flight.departureTime, 'dd.MM.yyyy HH:mm')}">
                </div>
                <div class="flex justify-between items-center gap-3">
                    <span class="text-xl font-semibold" th:text="${flight.price} + ' $'"></span>
                    <a th:href="@{/booking(flightId=${flight.id})}"
                       class="bg-blue-700 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-800 transition ml:6">
                        Выбрать
                    </a>
                </div>
            </div>
        </div>
    </section>

    <section class="ml-2">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Доступные отели</h2>
        <div th:if="${#lists.isEmpty(hotels)}" class="text-gray-400 text-center py-8">Отели не найдены</div>
        <div class="flex gap-6">
            <div th:each="hotel: ${hotels}" class="bg-white rounded-2xl shadow p-6 hover:shadow-md transition">

                <h3 class="text-lg font-bold text-gray-800 mb-1"
                    th:text="${hotel.name}"></h3>
                <div class="flex justify-between items-center mb-4">
                    <p class="text-gray-400 text-sm "
                       th:text="${hotel.city}">Minsk</p>
                    <span class="text-xs bg-green-100 text-green-700 font-semibold px-2 py-1 rounded-full"
                          th:text="${hotel.availableRooms} + ' номеров'"></span>
                </div>
                <div class="flex justify-between items-center gap-3">
                    <div class="flex flex-col items-end">
                        <p class="text-xl font-semibold text-gray-900"
                           th:text="${hotel.pricePerNight} + ' $'"></p>
                        <p class="text-xs  font-medium text-gray-400 mt-0.5">за ночь</p>
                    </div>
                    <a th:href="@{/booking(hotelId=${hotel.id})}"
                       class="bg-blue-700 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-800 transition ml:6">
                        Выбрать
                    </a>
                </div>
            </div>
        </div>
    </section>
</main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Регистрация</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-blue-700 to-blue-400 min-h-screen flex items-center justify-center">
<div class="bg-white rounded-2xl shadow-2xl p-10 w-full max-w-md">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-gray-800">TourBooking</h1>
        <p class="text-gray-400 mt-1">Зарегистрировать аккаут</p>
    </div>

    <div th:if="${error}" class="bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-lg mb-6 text-sm">
        <span th:text="${error}"></span>
    </div>

    <form th:action="@{/register}" method="post" class="space-y-5">
        <div>
            <label for="username" class="block text-sm font-semibold text-gray-700 mb-1">Username</label>
            <input type="text" id="username" name="username" required class="w-full border rounded-xl px-4 py-3
focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="ivan123">
        </div>
        <div>
            <label for="email" class="block text-sm font-semibold text-gray-700 mb-1">Email</label>
            <input type="email" id="email" name="email" required class="w-full border rounded-xl px-4 py-3
focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="ivan@example.com">
        </div>
        <div>
            <label for="password" class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
            <input id="password" type="password" name="password" required
                   class="w-full border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                   placeholder="*******">
        </div>
        <button type="submit"
                class="w-full bg-blue-600 text-white py-3 rounded-xl font-semibold hover:bg-blue-700 transition">
            Зарегистироваться
        </button>
    </form>

    <p class="text-center text-gray-400 mt-6 text-sm">
        Уже есть аккаунт?
        <a href="/login" class="text-blue-600 hover:underline font-semibold pl-1">Войти</a>
    </p>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мои заказы</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 min-h-screen">

<nav class="bg-blue-700 text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
        <a href="/index" class="font-bold text-2xl">TourBooking</a>
        <div class="flex items-center gap-6">
            <span class="text-blue-200 text-sm" th:text="${session.username}"></span>
            <a href="/my-orders" class="text-white font-semibold text-sm border-b border-white">Мои заказы</a>
            <a href="/logout"
               class="bg-white text-blue-700 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-50 transition">
                Выйти
            </a>
        </div>
    </div>
</nav>

<main class="max-w-4xl mx-auto px-4 py-10">

    <h1 class="text-3xl font-bold text-gray-800 mb-8">Мои заказы</h1>

    <div th:if="${#lists.isEmpty(orders)}"
         class="bg-white rounded-2xl shadow p-12 text-center">
        <div class="text-5xl mb-4">📋</div>
        <p class="text-gray-400 text-lg">У вас пока нет заказов</p>
        <a href="/booking"
           class="mt-6 inline-block bg-blue-700 text-white px-6 py-3 rounded-xl hover:bg-blue-800 transition font-semibold">
            Забронировать тур
        </a>
    </div>

    <div class="space-y-4" th:unless="${#lists.isEmpty(orders)}">
        <div th:each="order : ${orders}"
             class="bg-white rounded-2xl shadow p-6 hover:shadow-md transition">

            <div class="flex justify-between items-start mb-4">
                <div>
                    <p class="text-xs text-gray-400 mb-1" th:text="'ID: ' + ${order.id}"></p>
                    <p class="text-sm text-gray-500"
                       th:text="${#temporals.format(order.createdAt, 'dd.MM.yyyy HH:mm')}"></p>
                </div>

                <span th:switch="${order.status}">
                    <span th:case="'CONFIRMED'"
                          class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm font-semibold">
                        ✅ Подтверждён
                    </span>
                    <span th:case="'CANCELLED'"
                          class="bg-red-100 text-red-600 px-3 py-1 rounded-full text-sm font-semibold">
                        ❌ Отменён
                    </span>
                    <span th:case="'PENDING'"
                          class="bg-yellow-100 text-yellow-700 px-3 py-1 rounded-full text-sm font-semibold">
                        ⏳ Ожидание
                    </span>
                    <span th:case="*"
                          class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-sm font-semibold"
                          th:text="${order.status}">
                    </span>
                </span>
            </div>

            <div class="grid grid-cols-3 gap-4 text-sm">
                <div>
                    <p class="text-gray-400 mb-1">ID Рейса</p>
                    <p class="font-semibold" th:text="${order.flightId()}">—</p>
                </div>
                <div>
                    <p class="text-gray-400 mb-1">ID Отеля</p>
                    <p class="font-semibold" th:text="${order.hotelId}">—</p>
                </div>
                <div>
                    <p class="text-gray-400 mb-1">Сумма</p>
                    <p class="font-bold text-blue-700"
                       th:text="${order.amount != null ? order.amount + ' $' : '—'}">—</p>
                </div>
            </div>

            <div th:if="${order.reason != null}"
                 class="mt-3 bg-red-50 border border-red-100 rounded-lg px-4 py-2 text-sm text-red-600">
                <span th:text="'Причина: ' + ${order.reason}"></span>
            </div>

        </div>
    </div>

</main>

</body>
</html>
